name: ruff

on:
  pull_request:
    types:
      - 'synchronize'
      - 'opened'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: astral-sh/ruff-action@v4.1.0
    - name: Check formatting of changed and new files
      env:
        BASE: ${{ github.base_ref }}
      run: |
        git diff -z --name-only --diff-filter=ACMR "origin/$BASE...HEAD" -- '*.py' '*.pyi' '*.md' \
          | xargs -0 -r ruff format --check --diff
