name: 'mypy'

on:
  pull_request:
    types:
      - 'synchronize'
      - 'opened'

jobs:
  type-check:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: pip install mypy websocket-client

    - name: Type-Check
      run: mypy .
